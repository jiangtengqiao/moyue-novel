name: Build & Push Docker Image

# 每次推送 backend 代码变更时自动构建 Docker 镜像并推送到 GitHub Container Registry
on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - '.github/workflows/docker-image.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/moyue-novel-api:latest
            ghcr.io/${{ github.repository_owner }}/moyue-novel-api:${{ github.sha }}
